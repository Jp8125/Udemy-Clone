<div class="container-fluid p-0">
    <div class="bg-dark px-2 px-lg-0 py-5 text-lg-center text-start  text-white">
        <h3>{{ course.name }}</h3>
        <p class="text-break">{{ course.description }}</p>
    </div>
    <div class="d-flex justify-content-center align-self-center p-2">
        <div class="container row p-0 p-lg-3">
            <div class="col-12 col-lg-8 p-0 p-lg-3 order-2  order-lg-1 ">
                <div class="container mt-5 p-lg-5 p-2 border">
                    <h4 class="fs-4 fw-bold">What you'll learn</h4>
                    <div class="row px-3 mt-4">
                        <ng-container *ngFor="let item of course.topics; let i = index">
                            <ul class="col-md-6 ">
                                <li>{{ item.title }}</li>
                            </ul>
                        </ng-container>
                    </div>
                </div>
                <div class="container mt-5 p-0">
                    <h4 class="fs-4 fw-bold">Course Content</h4>
                    <div class="mt-3">
                        <div class="accordion accordion-flush border" id="accordionFlushExample">
                            <div class="accordion-item" *ngFor="let topic of course.topics;let i=index">
                                <h2 class="accordion-header" id="flush-headingOne">
                                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                        [attr.data-bs-target]="'#flush-'+i" aria-expanded="false" [attr.aria-controls]="'flush-'+i">
                                        {{ topic.title }}
                                    </button>
                                </h2>
                                <div [id]="'flush-'+i" class="accordion-collapse collapse" aria-labelledby="flush-headingOne"
                                    data-bs-parent="#accordionFlushExample">
                                    <div class="accordion-body">
                                        <ul *ngFor="let item of topic.subtopics">
                                            <li>{{ item.title }}</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12  col-lg-4 p-0 order-1 order-lg-2 ">
                <div class="card p-2 p-lg-4 rounded-0 shadow-box  border-0 sticky-top">
                    <div class="card-body  ">
                        <h3 class="card-title fw-bold">{{course.price|currency:"INR"}}</h3>
                        <ng-container *ngIf="showcart;else gotocart">
                        <button class="btn btn-purple w-100 px-5 mt-2  rounded-0 py-2 text-white fw-bold" type="button" (click)="addTocart()">
                            Add to Cart
                        </button>
                    </ng-container>
                        <ng-template #gotocart>
                            <ng-container *ngIf="showMylearnig;else learning">
                                <button class="btn btn-purple w-100 px-5 mt-2  rounded-0 py-2 text-white fw-bold" type="button" routerLink="/mylearnings">
                                    Go to Mylearning
                                </button>
                            </ng-container>
                            <ng-template #learning>
                                <button class="btn btn-purple w-100 px-5 mt-2  rounded-0 py-2 text-white fw-bold" type="button" (click)="goTocart()">
                                    Go to Cart
                                </button>
                            </ng-template>
                        </ng-template>
                        <h4 class="card-title mt-4">This Course Includes</h4>
                        <p class="card-text"><em class="fa-solid fa-book me-2"></em> Total {{course.duration}} hours of learning</p>
                        <p class="card-text"><em class="fa-solid fa-laptop me-2"></em> available in all devices</p>
                    </div>
                </div>
            </div>
          </div>
         
    </div>
 
</div>
