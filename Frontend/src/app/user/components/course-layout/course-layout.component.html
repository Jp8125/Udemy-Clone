<div class="container-fluid mb-2">
  <div class="p-1 p-lg-5 mb-4 bg-info-subtle  rounded-3">
    <div class="container-fluid py-5">
      <h1 class="display-5 fw-bold">{{courseToview.name}}</h1>
      <p class="col-lg-8 fs-6 bg-white p-3 m-heigth " [ngClass]="{'overflow-y-scroll ': courseToview.description.length>850}">{{courseToview.description}}</p>
    </div>

  </div>
  <ul class="nav nav-pills mb-3 row" id="pills-tab" role="tablist">
    <li class="nav-item col-6" role="presentation">
      <button class="nav-link w-100  active" id="pills-home-tab" data-bs-toggle="pill" data-bs-target="#pills-home"
        type="button" role="tab" aria-controls="pills-home" aria-selected="true">Course Overview</button>
    </li>
    <li class="nav-item col-6" role="presentation">
      <button class="nav-link w-100" id="pills-profile-tab" data-bs-toggle="pill" data-bs-target="#pills-profile"
        type="button" role="tab" aria-controls="pills-profile" aria-selected="false">VideoTutorials</button>
    </li>
  </ul>
  <div class="row">
    <div class="col-md-4">
      <div class="tab-content" id="pills-tabContent">
        <div class="tab-pane fade show active" id="pills-home" role="tabpanel" aria-labelledby="pills-home-tab">
          <div class="h-100 p-1 p-lg-5 bg-info-subtle rounded-3">
            <ul class="list-group list-group-flush">
              <li class="list-group-item my-4" *ngFor="let item of courseToview.topics" [routerLink]="['./topics']"
                [queryParams]="{course:courseToview.name,topic:item.title}">{{item.title}}</li>
            </ul>
          </div>
        </div>
        <div class="tab-pane fade" id="pills-profile" role="tabpanel" aria-labelledby="pills-profile-tab"> 
              <div class="h-100 p-1 p-lg-5 bg-info-subtle rounded-3">
                <div class="accordion accordion-flush border" id="accordionFlushExample">
                  <div class="accordion-item" *ngFor="let topic of courseToview.topics;let i=index">
                    <h2 class="accordion-header" id="flush-headingOne">
                      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        [attr.data-bs-target]="'#flush-'+i" aria-expanded="false" [attr.aria-controls]="'flush-'+i">
                        {{ topic.title }}
                      </button>
                    </h2>
                    <div [id]="'flush-'+i" class="accordion-collapse collapse" aria-labelledby="flush-headingOne"
                      data-bs-parent="#accordionFlushExample">
                      <div class="accordion-body">
                        <ul *ngFor="let item of topic.subtopics">
                          <li [routerLink]="['./video']" [queryParams]="{course:courseToview.name,Tid:item.subTopicId}">
                            {{ item.title }}</li>
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
        </div>
      </div>
    </div>
    <div class="col-md-8">
      <div class="h-100 p-1 p-lg-5 bg-info-subtle  rounded-3">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
